name: Terraform

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tftest.hcl"
      - ".terraform.lock.hcl"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tftest.hcl"
      - ".terraform.lock.hcl"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform test

  apply:
    if: github.event_name != 'pull_request' && vars.CD_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_team_name: ${{ vars.CLOUDFLARE_TEAM_NAME }}
      TF_VAR_discord_oidc_issuer_url: ${{ vars.DISCORD_OIDC_ISSUER_URL }}
      TF_VAR_discord_oidc_client_id: ${{ vars.DISCORD_OIDC_CLIENT_ID }}
      TF_VAR_enable_discord_oidc_idp: ${{ vars.ENABLE_DISCORD_OIDC_IDP }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0

      # Exports every variable in the linked 1Password Environment
      # (CLOUDFLARE_API_TOKEN, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
      # TF_VAR_discord_oidc_client_secret). See README.md.
      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: "true"
        env:
          OP_WORKLOAD_ID: ${{ vars.OP_WORKLOAD_ID }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
          OP_INTEGRATION_KEY: ${{ secrets.OP_INTEGRATION_KEY }}

      - run: terraform init -input=false
      - run: terraform plan -out=tfplan -input=false
      - run: terraform apply -input=false -auto-approve tfplan
